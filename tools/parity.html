<!doctype html>
<meta charset="utf-8">
<title>Сверка разбора JS с Питоном</title>
<pre id="out">идёт сверка…</pre>
<script src="../docs/ezhi.js"></script>
<script>
// Тот же обход, что в браузере, но страницы берутся из cache/ (их же разбирал Питон в docs/data/catalog.json).
(async () => {
  const out = document.getElementById("out");
  try {
    const py = await (await fetch("../docs/data/catalog.json")).json();
    const js = await EZ.crawl(null, async (topic, st) => {
      const r = await fetch(`../cache/${topic}_${st}.html`);
      if (!r.ok) throw new Error(`нет ../cache/${topic}_${st}.html`);
      return r.text();
    });
    const pm = new Map(py.items.map((i) => [i.id, i])), jm = new Map(js.items.map((i) => [i.id, i]));
    const onlyPy = [...pm.keys()].filter((k) => !jm.has(k)), onlyJs = [...jm.keys()].filter((k) => !pm.has(k));
    const diffs = [];
    for (const [id, a] of pm) {
      const b = jm.get(id);
      if (!b) continue;
      for (const f of ["n", "g", "p", "d", "t", "u", "im", "o", "px", "xs", "pi", "st", "l"])
        if (JSON.stringify(a[f]) !== JSON.stringify(b[f])) diffs.push({ id, f, py: a[f], js: b[f] });
    }
    const topics = JSON.stringify(py.topics) === JSON.stringify(js.topics);
    const order = JSON.stringify(py.items.map((i) => i.id)) === JSON.stringify(js.items.map((i) => i.id));
    out.textContent = JSON.stringify({ py: py.items.length, js: js.items.length, onlyPy: onlyPy.slice(0, 5),
      onlyPyN: onlyPy.length, onlyJs: onlyJs.slice(0, 5), onlyJsN: onlyJs.length, diffsN: diffs.length,
      diffs: diffs.slice(0, 6), topics, order }, null, 1);
  } catch (e) { out.textContent = "ОШИБКА " + e.stack; }
  document.title = "готово";
})();
</script>
